<div class="app-login-view">
  @switch (mode()) {
    @case ('login') {
      <h3>Login</h3>
      @if (signInErrorMessage(); as signInErrorMessage) {
        <p class="app-login-view-signin-error" role="alert" [dbxTextColor]="'warn'">{{ signInErrorMessage }}</p>
      }
      <dbx-firebase-login></dbx-firebase-login>
      <p>
        Need an account? Register
        <dbx-link (click)="mode.set('register')">here</dbx-link>
        .
      </p>
      <dbx-firebase-login-terms></dbx-firebase-login-terms>
    }
    @case ('register') {
      <h3>Register</h3>
      <dbx-firebase-register></dbx-firebase-register>
      <p>
        Have an account? Log in
        <dbx-link (click)="mode.set('login')">here</dbx-link>
        .
      </p>
      <dbx-firebase-login-terms></dbx-firebase-login-terms>
    }
  }
</div>
