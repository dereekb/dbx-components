<dbx-content-page dbxAppContextState="public">
  <dbx-content-container>
    <dbx-section-page header="Settings">
      <dbx-section header="Linked Login Providers" hint="Sign-in providers linked to this account.">
        <dbx-firebase-manage-auth-providers></dbx-firebase-manage-auth-providers>
      </dbx-section>
      <dbx-section header="Connected Apps" hint="Third-party services this account is connected to.">
        <!-- Deliberately distinct from "Linked Login Providers" above: that is how you sign in, this is what you have connected. -->
        <dbx-firebase-external-connections></dbx-firebase-external-connections>
      </dbx-section>
      <dbx-section header="Notifications" hint="Check whether notifications can actually reach you.">
        <!-- a NotificationUser's document id is the uid, so the directive's documentId takes it directly -->
        <div dbxFirebaseNotificationUserDocument [documentId]="uidSignal()">
          <dbx-firebase-notification-healthcheck-dialog-button></dbx-firebase-notification-healthcheck-dialog-button>
        </div>
      </dbx-section>
      <dbx-section header="Token">
        <dbx-content-pit style="overflow: hidden">
          <dbx-label-block>{{ currentIdTokenStringSignal() }}</dbx-label-block>
        </dbx-content-pit>
        <dbx-content-pit>
          <p class="dbx-json" style="overflow: hidden">{{ idTokenResultSignal() | json }}</p>
        </dbx-content-pit>
        <dbx-button (buttonClick)="refreshToken()" text="Refresh Token"></dbx-button>
      </dbx-section>
    </dbx-section-page>
  </dbx-content-container>
</dbx-content-page>
