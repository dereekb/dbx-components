<dbx-section header="Guestbook Album" hint="Everyone who has signed this guest book can add up to {{ photosMaxFiles }} photos here.">
  @if (!hasAlbumSignal()) {
    <div dbxAction dbxActionValue [dbxActionHandler]="handleStartAlbum">
      <p class="dbx-note">Nobody has started this guest book's album yet.</p>
      <dbx-button dbxActionButton [raised]="true" color="primary" text="Start the Album"></dbx-button>
      <dbx-error dbxActionError></dbx-error>
    </div>
  } @else {
    <!-- no remove button: a signer may add to the shared album, but the space's `u` is the guestbook's creator, so only they may take a photo back out of it -->
    <dbx-firebase-formspace-slot-upload [slot]="photosSlot" label="Photos" [maxFiles]="photosMaxFiles" emptyText="No photos yet. Add the first one." uploadText="Add Photos" [showRemoveButton]="false" fileTypesAccepted="image/jpeg,image/png,application/pdf"></dbx-firebase-formspace-slot-upload>
  }
</dbx-section>
