<dbx-content-container>
  <doc-feature-layout header="Browser Agent Extension" hint="Renders a different component depending on the detected operating system, browser, and device.">
    <!-- Examples -->
    <doc-feature-example header="dbx-browser-agent-view" hint="Config built with makeDbxBrowserAgentViewConfigFromOsMap(). Use the button to pick another device.">
      <dbx-content-border>
        <dbx-browser-agent-view [config]="osMapConfig"></dbx-browser-agent-view>
      </dbx-content-border>
    </doc-feature-example>
    <doc-feature-example header="dbx-browser-agent-view custom entries" hint="Ordered entries with custom matches. iOS Safari and iOS Chrome show different content. The first matching entry wins.">
      <p>Override Key: {{ customOverrideKey() ?? 'none' }}</p>
      <dbx-content-border>
        <dbx-browser-agent-view [config]="customConfig" [(overrideKey)]="customOverrideKey"></dbx-browser-agent-view>
      </dbx-content-border>
    </doc-feature-example>
    <doc-feature-example header="Detected Browser Agent" hint="The BrowserAgentInfo provided by DbxBrowserAgentService.">
      <pre>{{ agentInfo | json }}</pre>
    </doc-feature-example>
  </doc-feature-layout>
</dbx-content-container>
