<dbx-content-container>
  <doc-feature-layout header="MCP Connect" hint="Shows users the app's MCP server URL and how to connect AI assistants such as Claude, Claude Code, ChatGPT, Cursor, and VS Code to it.">
    <doc-feature-example header="dbx-mcp-connect-button" hint="Opens a dialog with the MCP server URL and per-client instructions. It needs no config here: provideDbxFirebaseOidc() provides the server URL from the app's OIDC config.">
      <dbx-mcp-connect-button></dbx-mcp-connect-button>
      <h3>With a custom header and button style</h3>
      <dbx-mcp-connect-button [config]="styledButtonConfig"></dbx-mcp-connect-button>
    </doc-feature-example>

    <doc-feature-example header="dbx-mcp-connect-view" hint="The dialog's content, shown inline. It uses the same server URL from the OIDC config.">
      <dbx-mcp-connect-view></dbx-mcp-connect-view>
    </doc-feature-example>

    <doc-feature-example header="dbx-mcp-connect-view with overrides" hint="An explicit server and a reduced client list that includes Grok, which is not in the default list.">
      <dbx-mcp-connect-view [server]="exampleServer" [clients]="exampleClients" defaultClientId="cursor"></dbx-mcp-connect-view>
    </doc-feature-example>
  </doc-feature-layout>
</dbx-content-container>
