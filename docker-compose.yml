# NOTE: Be careful updating this file, as it is used by the setup script.
services:
  demo-api-server:
    build: .
    # network_mode: host    # uncomment for enabling local development. will prevent parallel execution (I.E. tests and local dev at same time)
    volumes:
      - ./:/code
      - /code/node_modules # Excludes node_modules
      - ./.firebase/emulators/:/opt/workspace:cached
      - ./.firebase/bin/:/root/.cache:cached
      - ./.firebase/config/:/root/.config:cached
      - ./.firebase/data/:/root/data
    ports:
      # - '9229:9229' # node-inspect debug port. Can be disabled if not being used.
      - '9900-9908:9900-9908' # expose for browser access
    command: npx nx run demo-api:serve
    tty: true
    environment:
      # disable GCE Metadata retrieval.
      # https://github.com/firebase/firebase-tools/issues/6765
      - METADATA_SERVER_DETECTION=none
      - GCE_METADATA_HOST=0.0.0.0
      # Credentials URL
      - GCLOUD_PROJECT=dereekb-components
      - NODE_EXTRA_CA_CERTS=/code/docker/nginx/certs/firebase.crt
      # Nx disables its daemon whenever CI=true. Without the daemon every nested `npx nx run
      # <pkg>:build-base` rebuilds the entire project graph, and since @nx/rollup/plugin is
      # registered graph construction evaluates every rollup.config.cjs -- so concurrent
      # reconstructions serialize on the graph-construction file lock and stall the container.
      # `CI` is normally unset here (docker compose run does not inherit host env), so this is a
      # guard for the case where it leaks in. Same reason .circleci/config.yml pins NX_DAEMON.
      - NX_DAEMON=true
      # Seconds the Functions emulator waits for dist/apps/demo-api/main.js to report its function
      # definitions (firebase-tools defaults to 10s). On a loaded machine the bundle can miss that
      # window, and the emulator then comes up "ready" with ZERO functions: every hosting rewrite
      # (/mcp, /.well-known/*, /oidc) 404s and MCP OAuth discovery falls back to a bogus
      # <appUrl>/authorize. The only sign is one "Failed to load function definition" log line.
      - FUNCTIONS_DISCOVERY_TIMEOUT=60
    # extra_hosts:    # uncomment for enabling local development. Don't forget to start the offline nginx server!
    # - "firebase-public.firebaseio.com:0.0.0.0"
    networks:
      - demo-api-network
networks:
  demo-api-network:
    driver: bridge
