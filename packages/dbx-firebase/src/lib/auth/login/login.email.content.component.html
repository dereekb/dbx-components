<div class="dbx-firebase-login-email-content" aria-live="polite">
  @switch (emailModeSignal()) {
    @case ('login') {
      <ng-container *ngTemplateOutlet="loginView"></ng-container>
    }
    @case ('recover') {
      <dbx-injection [config]="recoveryViewConfig"></dbx-injection>
    }
    @case ('recoversent') {
      <dbx-injection [config]="recoverySentViewConfig"></dbx-injection>
    }
  }
</div>

<!-- Login View -->
<ng-template #loginView>
  <ng-container dbxAction [dbxActionHandler]="handleLoginAction">
    <dbx-firebase-email-forge-form [config]="formConfig" dbxActionForm [dbxFormSource]="emailFormValueSignal()"></dbx-firebase-email-forge-form>
    @if (isLoginMode) {
      <div class="dbx-firebase-login-email-forgot-prompt">
        <dbx-link [anchor]="forgotAnchor">Forgot Password?</dbx-link>
      </div>
    }
    <div class="dbx-flex">
      <dbx-button class="dbx-button-wide" [text]="buttonText" [raised]="true" color="primary" dbxActionButton></dbx-button>
      <dbx-button-spacer></dbx-button-spacer>
      <span class="dbx-spacer"></span>
      <dbx-button text="Cancel" [flat]="true" color="grey" (buttonClick)="onCancel()"></dbx-button>
    </div>
    <dbx-error dbxActionError></dbx-error>
  </ng-container>
</ng-template>
