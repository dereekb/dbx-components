<dbx-popover-content>
  <!-- Header -->
  <dbx-popover-header [icon]="icon" [header]="header">
    @if (showSwitchButtons) {
      @switch (showPresetSignal()) {
        @case (true) {
          <dbx-button [buttonStyle]="switchButtonStyle" [text]="customizeButtonText" (buttonClick)="showCustom()"></dbx-button>
        }
        @case (false) {
          <dbx-button [buttonStyle]="switchButtonStyle" [text]="presetsButtonText" (buttonClick)="showPresets()"></dbx-button>
        }
      }
    }
    @if (showCloseButton) {
      @if (showSwitchButtons) {
        <dbx-button-spacer></dbx-button-spacer>
      }
      <dbx-button [buttonStyle]="closeButtonStyle" [text]="closeButtonText" (buttonClick)="close()"></dbx-button>
    }
  </dbx-popover-header>
  <!-- Content -->
  <dbx-popover-scroll-content>
    <dbx-injection [config]="configSignal()"></dbx-injection>
  </dbx-popover-scroll-content>
</dbx-popover-content>
